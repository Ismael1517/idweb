<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Tareas Académicas - UNSA</title>
    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container-fluid px-4 py-4">
        <!-- Encabezado con la imagen cargada localmente -->
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div class="d-flex align-items-center gap-3">
                <!-- AQUÍ ESTÁ LA IMAGEN CARGADA DE TU CARPETA -->
                <img src="logo-unsa.png" alt="Logo UNSA" class="logo-unsa">
                <div>
                    <h2 class="fw-bold mb-0 text-dark">Mi Agenda Académica</h2>
                    <small class="text-muted">Gestión interactiva de pendientes universitarios</small>
                </div>
            </div>
            <!-- Contador tipo Badge -->
            <div id="estadisticas" class="badge-counter p-2 rounded-3"></div>
        </header>

        <!-- Zona para Alertas Dinámicas -->
        <div id="divAlertas"></div>

        <div class="row g-4">
            <!-- COLUMNA IZQUIERDA: Formulario -->
            <div class="col-lg-4">
                <div class="card card-custom p-3">
                    <h5 class="fw-bold mb-3 text-unsa"><i class="fa-solid fa-plus-circle me-2"></i>Nueva Tarea</h5>
                    <form id="formTarea">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Título de la actividad</label>
                            <input type="text" id="titulo" class="form-control custom-input" placeholder="Ej. Informe de Laboratorio">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Curso / Asignatura</label>
                            <input type="text" id="curso" class="form-control custom-input" placeholder="Ej. Desarrollo Web">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Fecha límite</label>
                            <input type="date" id="fechaEntrega" class="form-control custom-input">
                        </div>
                        <button type="submit" class="btn btn-custom w-100 mt-2">
                            <i class="fa-solid fa-floppy-disk me-2"></i>Registrar Tarea
                        </button>
                    </form>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Filtros y Lista de Tareas -->
            <div class="col-lg-8">
                <!-- Barra de Filtros -->
                <div class="d-flex align-items-center justify-content-between mb-3 bg-white p-2 rounded-3 border">
                    <span class="small fw-bold text-muted ms-2">Filtrar por:</span>
                    <div class="btn-group filter-group" role="group">
                        <button type="button" class="btn filter-btn active" onclick="filtrarTareas('todas')">Todas</button>
                        <button type="button" class="btn filter-btn" onclick="filtrarTareas('pendientes')">Pendientes</button>
                        <button type="button" class="btn filter-btn" onclick="filtrarTareas('completadas')">Completadas</button>
                    </div>
                </div>

                <!-- Contenedor donde se insertan las tarjetas -->
                <div id="listaTareas" class="row g-3"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
